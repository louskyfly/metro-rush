<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1f3b">
<title>Métro Rush</title>
<meta name="apple-mobile-web-app-title" content="Métro Rush">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f3b; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; touch-action: none; }
  button { font: inherit; color: #fff; border: 0; cursor: pointer; touch-action: manipulation; }
  .ci { display: inline-block; width: 1em; height: 1em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, #ffc300 45%, #c98a00); box-shadow: inset 0 0 0 2px #e0a100; vertical-align: -0.12em; }
  .ov { position: fixed; inset: 0; display: none; z-index: 10; }
  .ov.on { display: flex; }
  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  #hud.on { display: block; }
  #scoreBox { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left)); }
  #score { font-size: 38px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #0006; font-variant-numeric: tabular-nums; }
  #mult { display: inline-block; margin-top: 2px; font-weight: 900; font-size: 18px; background: #ffffff26; padding: 2px 10px; border-radius: 10px; }
  #mult.x2 { background: #ff006e; animation: pulse .8s infinite; }
  #topR { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right)); display: flex; gap: 10px; align-items: center; }
  #coins { font-size: 26px; font-weight: 900; background: #0005; padding: 6px 14px; border-radius: 16px; text-shadow: 0 2px 0 #0006; font-variant-numeric: tabular-nums; }
  #pauseBtn { pointer-events: auto; width: 52px; height: 52px; border-radius: 16px; background: #0006; font-size: 22px; font-weight: 900; }
  #pups { position: absolute; left: calc(14px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .pup { display: flex; align-items: center; gap: 8px; background: #0006; padding: 6px 10px; border-radius: 14px; font-weight: 800; font-size: 15px; width: 190px; }
  .pup .bar { flex: 1; height: 8px; border-radius: 4px; background: #ffffff30; overflow: hidden; }
  .pup .bar i { display: block; height: 100%; border-radius: 4px; }
  #boardBtn { pointer-events: auto; position: absolute; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 26px; background: linear-gradient(160deg, #ff6b35, #ffd166); font-weight: 900; font-size: 13px; box-shadow: 0 6px 0 #0005; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  #boardBtn .bd { width: 54px; height: 16px; border-radius: 8px; background: #fff; box-shadow: inset 0 -4px 0 #0003; }
  #boardBtn.used { filter: grayscale(1); opacity: .45; }
  #boardBtn.active { animation: pulse .7s infinite; }
  #toast { position: absolute; top: 28%; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 900; text-shadow: 0 4px 0 #0007; opacity: 0; transition: opacity .25s; }
  #toast.on { opacity: 1; }
  #hint { position: absolute; bottom: 22%; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: 800; text-shadow: 0 3px 0 #0008; opacity: 0; transition: opacity .4s; }
  #hint.on { opacity: 1; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 6; transition: opacity .35s; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  /* Menus */
  .panel { margin: auto 0 auto calc(5vw + env(safe-area-inset-left)); width: min(460px, 46vw); display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
  .logo { line-height: .9; font-weight: 1000; font-style: italic; letter-spacing: -1px; transform: rotate(-4deg); margin-bottom: 8px; }
  .logo span { display: block; font-size: min(92px, 10vw); color: #ffd166; text-shadow: 0 5px 0 #e63946, 0 10px 0 #1b1f3b, 0 12px 18px #0008; -webkit-text-stroke: 2px #1b1f3b; }
  .logo span + span { color: #4cc9f0; margin-left: 40px; text-shadow: 0 5px 0 #7209b7, 0 10px 0 #1b1f3b, 0 12px 18px #0008; }
  .row { display: flex; gap: 10px; }
  .pill { flex: 1; background: #1b1f3bcc; border-radius: 16px; padding: 10px 14px; font-size: 17px; font-weight: 700; text-align: center; }
  .pill b { font-size: 22px; }
  .big { background: linear-gradient(180deg, #ffd166, #ff9f1c); color: #2b1b00; font-size: 34px; font-weight: 1000; padding: 18px; border-radius: 22px; box-shadow: 0 7px 0 #b35c00, 0 12px 22px #0007; }
  .mid { background: linear-gradient(180deg, #4cc9f0, #4361ee); font-size: 22px; font-weight: 900; padding: 14px; border-radius: 18px; box-shadow: 0 6px 0 #2b2d8f, 0 10px 18px #0006; }
  .small { background: #1b1f3bcc; font-size: 16px; font-weight: 700; padding: 10px; border-radius: 14px; }
  .big:active, .mid:active, .small:active { transform: translateY(3px); }
  .help { font-size: 14px; opacity: .9; background: #1b1f3b99; border-radius: 12px; padding: 8px 12px; line-height: 1.4; }
  #menu, #shop, #over, #pause { background: linear-gradient(90deg, #1b1f3bdd 0%, #1b1f3b88 45%, #1b1f3b00 70%); }
  #pause, #over { background: #1b1f3bb8; justify-content: center; align-items: center; }
  .card { background: #262b55; border-radius: 26px; padding: 26px 30px; min-width: 340px; display: flex; flex-direction: column; gap: 12px; text-align: center; box-shadow: 0 16px 40px #0008; border: 3px solid #ffffff18; }
  .card h2 { margin: 0 0 4px; font-size: 34px; font-weight: 1000; font-style: italic; color: #ffd166; }
  .card .stat { display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; background: #ffffff10; padding: 10px 14px; border-radius: 12px; }
  .card .stat b { font-size: 24px; }
  #newBest { color: #06d6a0; font-weight: 900; font-size: 20px; display: none; animation: pulse .8s infinite; }
  /* Shop */
  #shop .panel { width: min(560px, 54vw); max-height: 92vh; }
  .tabs { display: flex; gap: 8px; }
  .tabs button { flex: 1; padding: 12px; border-radius: 14px; background: #1b1f3bcc; font-weight: 900; font-size: 18px; }
  .tabs button.on { background: #ffd166; color: #2b1b00; }
  #items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; overflow-y: auto; max-height: 52vh; padding: 2px; touch-action: pan-y; }
  .it { background: #262b55; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; border: 3px solid transparent; }
  .it.sel { border-color: #ffd166; }
  .it .sw { width: 100%; height: 58px; border-radius: 12px; }
  .it .nm { font-weight: 900; font-size: 17px; }
  .it button { width: 100%; padding: 8px; border-radius: 12px; font-weight: 900; background: #4361ee; font-size: 15px; }
  .it button.own { background: #06d6a0; color: #003322; }
  .it button.cur { background: #ffffff22; }
  .it button.poor { background: #555a7a; opacity: .7; }
  .shopTop { display: flex; justify-content: space-between; align-items: center; }
  .shopTop h2 { margin: 0; font-size: 34px; font-style: italic; font-weight: 1000; color: #ffd166; text-shadow: 0 4px 0 #e63946; }
  #rot { position: fixed; inset: 0; z-index: 30; background: #1b1f3b; display: none; align-items: center; justify-content: center; text-align: center; font-size: 22px; font-weight: 800; padding: 30px; }
</style>
</head>
<body>
<div id="hud">
  <div id="scoreBox"><div id="score">0</div><div id="mult">x1</div></div>
  <div id="topR"><div id="coins"><i class="ci"></i> <span id="coinN">0</span></div><button id="pauseBtn" aria-label="Pause">II</button></div>
  <div id="pups"></div>
  <button id="boardBtn"><span class="bd" id="boardIco"></span>PLANCHE</button>
  <div id="toast"></div>
  <div id="hint"></div>
</div>
<div id="flash"></div>

<div id="menu" class="ov on">
  <div class="panel">
    <div class="logo"><span>MÉTRO</span><span>RUSH</span></div>
    <div class="row"><div class="pill">Record<br><b id="mBest">0</b></div><div class="pill">Pièces<br><b><i class="ci"></i> <span id="mCoins">0</span></b></div></div>
    <button class="big" id="playBtn">JOUER</button>
    <div class="row"><button class="mid" id="shopBtn" style="flex:2">Boutique</button><button class="small" id="muteBtn" style="flex:1">Son : oui</button></div>
    <div class="help">Glisse ← → pour changer de voie, ↑ pour sauter, ↓ pour rouler. Tape deux fois pour sortir ta planche (une par partie).</div>
  </div>
</div>

<div id="shop" class="ov">
  <div class="panel">
    <div class="shopTop"><h2>Boutique</h2><div class="pill" style="flex:0 0 auto"><b><i class="ci"></i> <span id="sCoins">0</span></b></div></div>
    <div class="tabs"><button id="tabChars" class="on">Personnages</button><button id="tabBoards">Planches</button></div>
    <div id="items"></div>
    <button class="mid" id="shopBack">Retour</button>
  </div>
</div>

<div id="pause" class="ov">
  <div class="card">
    <h2>Pause</h2>
    <button class="big" id="resumeBtn">CONTINUER</button>
    <button class="small" id="quitBtn">Menu principal</button>
  </div>
</div>

<div id="over" class="ov">
  <div class="card">
    <h2 id="overTitle">Boum !</h2>
    <div id="newBest">NOUVEAU RECORD !</div>
    <div class="stat"><span>Score</span><b id="oScore">0</b></div>
    <div class="stat"><span>Pièces</span><b><i class="ci"></i> <span id="oCoins">0</span></b></div>
    <div class="stat"><span>Record</span><b id="oBest">0</b></div>
    <button class="big" id="againBtn">REJOUER</button>
    <div class="row"><button class="mid" id="overShop" style="flex:1">Boutique</button><button class="small" id="overMenu" style="flex:1">Menu</button></div>
  </div>
</div>

<script type="module">
import * as THREE from './three.module.js';

/* ================= Sauvegarde ================= */
const LS = 'metrorush.v1';
function loadSave() {
  let s = null; try { s = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
  s = s || {};
  s.best = s.best || 0; s.coins = s.coins || 0;
  s.chars = s.chars || ['leo']; s.boards = s.boards || ['classic'];
  s.char = s.char || 'leo'; s.board = s.board || 'classic';
  s.muted = !!s.muted; s.runs = s.runs || 0;
  return s;
}
const save = loadSave();
const persist = () => { try { localStorage.setItem(LS, JSON.stringify(save)); } catch (e) {} };

const CHARS = [
  { id: 'leo',  name: 'Léo',  price: 0,    skin: 0xf1c27d, shirt: 0xe63946, pants: 0x1d3557, shoes: 0xffffff, hair: 0x3b2314, hat: 'cap',    hatC: 0xffd166, pack: 0x2ec4b6 },
  { id: 'maya', name: 'Maya', price: 400,  skin: 0xc68642, shirt: 0x9b5de5, pants: 0x2b2d42, shoes: 0xf15bb5, hair: 0x1a1a1a, hat: 'pony',   hatC: 0xf15bb5, pack: 0xfee440 },
  { id: 'zack', name: 'Zack', price: 1200, skin: 0xffdbac, shirt: 0x06d6a0, pants: 0x3a3a3a, shoes: 0xff9f1c, hair: 0xe9c46a, hat: 'beanie', hatC: 0x118ab2, pack: 0xef476f },
  { id: 'robo', name: 'Robo', price: 3000, skin: 0xb8c4d6, shirt: 0x8d99ae, pants: 0x5c677d, shoes: 0x2b2d42, hair: 0x00f5d4, hat: 'robot',  hatC: 0x00f5d4, pack: 0x5c677d },
  { id: 'nina', name: 'Nina', price: 6000, skin: 0x8d5524, shirt: 0xffd166, pants: 0x0077b6, shoes: 0xffffff, hair: 0xff595e, hat: 'pony',   hatC: 0xff595e, pack: 0x8338ec },
  { id: 'or',   name: 'Doré',  price: 12000, skin: 0xffd166, shirt: 0xe9b200, pants: 0xb8860b, shoes: 0xfff1a8, hair: 0xffe066, hat: 'cap', hatC: 0xfff1a8, pack: 0xc99700 },
];
const BOARDS = [
  { id: 'classic', name: 'Classique',   price: 0,    c: ['#ff6b35', '#ffd166'] },
  { id: 'flamme',  name: 'Flamme',      price: 600,  c: ['#d00000', '#ffba08'] },
  { id: 'ocean',   name: 'Océan',       price: 1500, c: ['#0077b6', '#90e0ef'] },
  { id: 'galaxie', name: 'Galaxie',     price: 3500, c: ['#240046', '#c77dff'] },
  { id: 'jungle',  name: 'Jungle',      price: 5000, c: ['#1b4332', '#95d5b2'] },
  { id: 'arc',     name: 'Arc-en-ciel', price: 8000, c: ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'] },
];
if (!CHARS.find(c => c.id === save.char)) save.char = 'leo';
if (!BOARDS.find(b => b.id === save.board)) save.board = 'classic';

/* ================= Rendu ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const FOG = 0xcde8ff;
scene.fog = new THREE.Fog(FOG, 70, 215);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 260);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
scene.background = canvasTex(4, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#3fa9f5'); gr.addColorStop(0.55, '#8fd0ff'); gr.addColorStop(0.8, '#cde8ff'); gr.addColorStop(1, '#cde8ff');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x7d8597, 1.25));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.7); sun.position.set(-6, 12, 5); scene.add(sun);

const LANES = [-2.2, 0, 2.2];
const G = 32, JUMP = 10.5, SUPER = 16.5, TOP = 2.95, RL = 5.5;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const lam = (c, o = {}) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o));

/* ---------- Voie : ballast + traverses (texture qui défile) ---------- */
const TRACK_W = 9.4, TILE = 4, SEG = 330;
const trackTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#8f857a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) { const v = 100 + Math.random() * 80 | 0; g.fillStyle = `rgb(${v},${v - 8},${v - 18})`; g.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 3, 2 + Math.random() * 3); }
  for (const lx of LANES) {
    const cx = (lx + TRACK_W / 2) / TRACK_W * w, half = 1.05 / TRACK_W * w;
    for (let s = 0; s < 4; s++) {
      const y = s * 64 + 24;
      g.fillStyle = '#5a3d2b'; g.fillRect(cx - half, y, half * 2, 15);
      g.fillStyle = '#6f4c36'; g.fillRect(cx - half, y, half * 2, 5);
    }
  }
  g.fillStyle = '#b8b0a3'; g.fillRect(0, 0, 10, h); g.fillRect(w - 10, 0, 10, h);
});
trackTex.wrapS = trackTex.wrapT = THREE.RepeatWrapping; trackTex.repeat.set(1, SEG / TILE);
const trackGeo = new THREE.PlaneGeometry(TRACK_W, SEG); trackGeo.rotateX(-Math.PI / 2);
const track = new THREE.Mesh(trackGeo, lam(0xffffff, { map: trackTex })); scene.add(track);

const pave = new THREE.Mesh(new THREE.PlaneGeometry(220, SEG).rotateX(-Math.PI / 2), lam(0xb9b2a6));
pave.position.y = -0.03; scene.add(pave);

// Rails
const railGeo = new THREE.BoxGeometry(0.11, 0.16, SEG); railGeo.translate(0, 0.08, 0);
const railMat = lam(0xc9ced6);
const rails = new THREE.InstancedMesh(railGeo, railMat, 6);
{ const m = new THREE.Matrix4(); let i = 0; for (const lx of LANES) for (const o of [-0.62, 0.62]) { m.makeTranslation(lx + o, 0, 0); rails.setMatrixAt(i++, m); } }
scene.add(rails);

// Murets tagués (texture qui défile)
const WALL_TILE = 18;
const wallTex = canvasTex(1024, 96, (g, w, h) => {
  g.fillStyle = '#a7a39b'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 64) { g.fillStyle = '#9a968e'; g.fillRect(x, 0, 2, h); }
  const cols = ['#ff006e', '#ffbe0b', '#3a86ff', '#8338ec', '#06d6a0', '#fb5607'];
  for (let i = 0; i < 9; i++) {
    const x = i * 115 + Math.random() * 30, c = pick(cols), c2 = pick(cols);
    g.fillStyle = c; g.beginPath(); g.ellipse(x + 50, 50, 46 + Math.random() * 14, 26 + Math.random() * 10, rnd(-0.3, 0.3), 0, 7); g.fill();
    g.lineWidth = 6; g.strokeStyle = '#1b1f3b'; g.stroke();
    g.fillStyle = c2; g.font = 'italic 900 34px Arial'; g.textAlign = 'center';
    g.fillText(pick(['MR', 'GO!', 'ZAP', 'WOW', 'YO', 'RUSH', '★']), x + 50, 62);
  }
  g.fillStyle = '#7d7a73'; g.fillRect(0, 0, w, 8);
});
wallTex.wrapS = THREE.RepeatWrapping; wallTex.repeat.set(SEG / WALL_TILE, 1);
const wallMat = lam(0xffffff, { map: wallTex });
const wallL = new THREE.Mesh(new THREE.PlaneGeometry(SEG, 1.5).rotateY(Math.PI / 2), wallMat);
const wallR = new THREE.Mesh(new THREE.PlaneGeometry(SEG, 1.5).rotateY(-Math.PI / 2), wallMat);
wallL.position.set(-TRACK_W / 2 - 0.05, 0.75, 0); wallR.position.set(TRACK_W / 2 + 0.05, 0.75, 0);
scene.add(wallL, wallR);
const wallCap = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.18, SEG), lam(0x7d7a73), 2);
{ const m = new THREE.Matrix4(); m.makeTranslation(-TRACK_W / 2 - 0.2, 1.55, 0); wallCap.setMatrixAt(0, m); m.makeTranslation(TRACK_W / 2 + 0.2, 1.55, 0); wallCap.setMatrixAt(1, m); }
scene.add(wallCap);

/* ---------- Immeubles (instancing, recyclés) ---------- */
const winTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#e8e8e8'; g.fillRect(0, 0, w, h);
  for (let y = 10; y < h; y += 32) for (let x = 10; x < w; x += 30) {
    const lit = Math.random() < 0.25;
    g.fillStyle = lit ? '#fff2b3' : '#3d4a66'; g.fillRect(x, y, 18, 20);
    g.fillStyle = '#ffffff55'; g.fillRect(x, y, 18, 4);
  }
});
winTex.wrapS = winTex.wrapT = THREE.RepeatWrapping; winTex.repeat.set(2, 3);
const BN = 26;
const bGeo = new THREE.BoxGeometry(1, 1, 1); bGeo.translate(0, 0.5, 0);
const bMesh = new THREE.InstancedMesh(bGeo, lam(0xffffff, { map: winTex }), BN * 2);
const roofMesh = new THREE.InstancedMesh(bGeo, lam(0x4a4e69), BN * 2);
bMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); roofMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(bMesh, roofMesh);
const BCOL = ['#ff6b6b', '#ffd166', '#06d6a0', '#4cc9f0', '#ef476f', '#f78c6b', '#83c5be', '#b392ac', '#ffafcc', '#90be6d', '#f9c74f', '#9d8df1'].map(c => new THREE.Color(c));
const blds = []; const far = { '-1': -30, '1': -30 };
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _e = new THREE.Euler();
function placeBld(i) {
  const b = blds[i];
  b.w = rnd(6, 13); b.h = rnd(7, 26); b.dz = rnd(7, 15);
  b.d = far[b.side] + rnd(0.6, 2.6) + b.dz / 2; far[b.side] = b.d + b.dz / 2;
  b.x = b.side * (TRACK_W / 2 + 2.2 + b.w / 2 + rnd(0, 1.5));
  _m.compose(_p.set(b.x, 0, -b.d), _q.identity(), _s.set(b.w, b.h, b.dz)); bMesh.setMatrixAt(i, _m);
  _m.compose(_p.set(b.x, b.h, -b.d), _q, _s.set(b.w + 0.5, 0.6, b.dz + 0.5)); roofMesh.setMatrixAt(i, _m);
  bMesh.setColorAt(i, pick(BCOL));
}
for (let i = 0; i < BN * 2; i++) { blds.push({ side: i < BN ? -1 : 1 }); placeBld(i); }

/* ---------- Portiques caténaires ---------- */
const AN = 11, ASP = 30;
const postMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.28, 9.2, 0.28).translate(0, 4.6, 0), lam(0x52606d), AN * 2);

  // obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    if (o.moving) { o.d0 -= o.vt * dt; o.group.position.z = -o.d0; }
    if (o.d0 + o.len < p.d - 14) { obstacles.splice(i, 1); freeObstacle(o); continue; }
    if (state !== 'play') continue;
    const ox = Math.abs(p.x - o.x);
    if (ox > o.hw + 0.3) continue;
    const lo = Math.min(p.prevD, p.d) - 0.3, hi = p.d + 0.3;
    if (hi < o.d0 || lo > o.d0 + o.len) continue;
    const frontal = ox < 0.75;
    if (o.kind === 'train') { if (p.y < o.top - 0.5) hurt(o, frontal); }
    else if (o.kind === 'low') { if (p.y < 0.95) hurt(o, frontal); }
    else if (o.kind === 'high') { if (p.y < 2.3 && p.y + ph > 1.25) hurt(o, frontal); }
    if (state !== 'play') break;
  }
  // pièces
  const mag = pw.magnet > 0;
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    if (c.d < p.d - 6) { coins.splice(i, 1); continue; }
    if (mag && !c.mag && c.d < p.d + 16 && Math.abs(c.x - p.x) < 7 && c.y < 5) c.mag = true;
    if (c.mag) { const k = Math.min(1, dt * 12); c.x += (p.x - c.x) * k; c.y += (p.y + 1 - c.y) * k; c.d += (p.d - c.d) * k; }
    if (Math.abs(c.d - p.d) < 0.9 + (p.d - p.prevD) && Math.abs(c.x - p.x) < 0.85 && c.y > p.y - 0.5 && c.y < p.y + ph + 0.5) {
      coins.splice(i, 1); run.coins++; run.score += 5 * run.mult; sfx('coin');
    }
  }
  for (let i = powerups.length - 1; i >= 0; i--) {
    const u = powerups[i];
    if (u.d < p.d - 6) { u.mesh.removeFromParent(); pwPool.push(u.mesh); powerups.splice(i, 1); continue; }
    if (Math.abs(u.d - p.d) < 1.1 && Math.abs(u.x - p.x) < 1 && u.y > p.y - 0.6 && u.y < p.y + ph + 0.6) {
      u.mesh.removeFromParent(); pwPool.push(u.mesh); powerups.splice(i, 1); sfx('power');
      if (u.type === 'jet') startJet(); else { pw[u.type] = PW[u.type].dur; toast(PW[u.type].name + ' !'); }
      renderPups(true);
    }
  }
  while (spawnD < p.d + 230) genRow();
  // poursuivant
  chaser.dist += (chaser.target - chaser.dist) * Math.min(1, dt * (chaser.target < chaser.dist ? 2.5 : 0.6));
}

function deadUpdate(dt) {
  p.deadT += dt;
  for (const o of obstacles) if (o.moving && p.deadT < 0.3) { o.d0 -= o.vt * dt; o.group.position.z = -o.d0; }
  if (p.y > p.ground || p.vy > 0) { p.vy -= G * dt; p.y = Math.max(p.ground, p.y + p.vy * dt); }
  chaser.dist += (chaser.target - chaser.dist) * Math.min(1, dt * 3);
  if (p.deadT > 1.6) gameOver();
}

let animT = 0;
function animateRunner(dt) {
  const r = runner; animT += dt;
  const playing = state === 'play' || state === 'dead' || state === 'pause' || state === 'over';
  r.root.position.set(p.x, p.y + (boardT > 0 && state === 'play' ? 0.2 : 0), -p.d);
  r.board.visible = (boardT > 0 && playing && state !== 'over') || (state === 'shop' && shopTab === 'boards');
  if (state === 'menu' || state === 'shop') {
    const t = animT;
    r.root.rotation.y = Math.PI + (state === 'shop' ? Math.sin(t * 0.7) * 0.5 : Math.sin(t * 0.5) * 0.25);
    r.pivot.rotation.set(0, 0, 0); r.pivot.scale.set(1, 1, 1); r.pivot.position.y = 0.9 + Math.sin(t * 2.5) * 0.015;
    r.armL.rotation.set(0, 0, -0.1 - Math.sin(t * 2.5) * 0.05); r.armR.rotation.set(Math.sin(t * 1.3) * 0.2 - 0.2, 0, 0.1);
    r.legL.rotation.set(0, 0, 0); r.legR.rotation.set(0, 0, 0); r.head.rotation.set(0, Math.sin(t * 0.9) * 0.3, 0);
    r.root.position.y = state === 'shop' && shopTab === 'boards' ? 0.2 : 0; r.jet.visible = false;
    return;
  }
  if (state === 'pause') return;
  r.root.rotation.y = 0;
  if (state === 'dead' || state === 'over') {
    const k = Math.min(1, p.deadT * 3);
    r.jet.visible = false; r.pivot.rotation.x = deathCause === 'caught' ? 0 : k * 1.45; r.pivot.position.y = 0.9 - k * 0.55;
    r.armL.rotation.x = -2.6 * k; r.armR.rotation.x = -2.6 * k; return;
  }
  const sp = run.speed; p.anim += dt * (6 + sp * 0.32);
  const a = p.anim;
  r.pivot.scale.set(1, 1, 1); r.pivot.position.y = 0.9; r.pivot.rotation.set(0, 0, 0);
  r.head.rotation.set(0, 0, 0);
  r.jet.visible = pw.jet > 0;
  if (pw.jet > 0) {
    r.jet.children.forEach(c => { if (c.userData.flame) c.scale.y = 0.7 + Math.random() * 0.6; });
    r.legL.rotation.x = 0.4; r.legR.rotation.x = 0.2; r.armL.rotation.set(-0.3, 0, -0.5); r.armR.rotation.set(-0.3, 0, 0.5); r.pivot.rotation.x = -0.25;
  } else if (p.roll > 0) {
    const k = 1 - p.roll / 0.62;
    r.pivot.position.y = 0.42; r.pivot.scale.set(1, 0.55, 1); r.pivot.rotation.x = -k * Math.PI * 2;
    r.legL.rotation.x = r.legR.rotation.x = -1.2; r.armL.rotation.set(-1.4, 0, 0); r.armR.rotation.set(-1.4, 0, 0);
  } else if (p.air) {
    r.legL.rotation.x = -1.0; r.legR.rotation.x = 0.5; r.armL.rotation.set(-2.4, 0, -0.2); r.armR.rotation.set(-2.2, 0, 0.2); r.pivot.rotation.x = -0.15;
  } else if (boardT > 0) {
    r.legL.rotation.x = -0.25; r.legR.rotation.x = 0.25; r.root.rotation.y = 0.5; r.armL.rotation.set(0, 0, -0.9); r.armR.rotation.set(0, 0, 0.9); r.pivot.rotation.x = -0.1;
  } else {
    r.legL.rotation.x = Math.sin(a) * 0.95; r.legR.rotation.x = -Math.sin(a) * 0.95;
    r.armL.rotation.set(-Math.sin(a) * 0.9, 0, -0.05); r.armR.rotation.set(Math.sin(a) * 0.9, 0, 0.05);
    r.pivot.position.y = 0.9 + Math.abs(Math.cos(a)) * 0.08; r.pivot.rotation.x = -0.12;
  }
  // inclinaison pendant changement de voie
  r.pivot.rotation.z = (p.x - LANES[p.lane]) * 0.12;
  if (invuln > 0) r.root.visible = Math.floor(invuln * 12) % 2 === 0; else r.root.visible = true;
}
function animateChaser(dt) {
  const show2 = (state === 'play' || state === 'dead' || state === 'pause' || state === 'over') && chaser.dist < 6;
  guard.root.visible = dog.visible = show2;
  if (!show2) return;
  chaser.x += (p.x - chaser.x) * Math.min(1, dt * 4);
  const gd = p.d - chaser.dist - 0.6, a = animT * 13;
  guard.root.position.set(chaser.x - 0.8, 0, -gd);
  if (state !== 'pause') {
    guard.legL.rotation.x = Math.sin(a) * 0.9; guard.legR.rotation.x = -Math.sin(a) * 0.9;
    const caught = state !== 'play' && deathCause === 'caught';
    guard.armL.rotation.x = caught ? -1.6 : -Math.sin(a) * 0.8; guard.armR.rotation.x = caught ? -1.6 : (Math.sin(animT * 4) > 0.3 ? -2.6 : Math.sin(a) * 0.8);
    guard.pivot.position.y = 0.9 + Math.abs(Math.cos(a)) * 0.07;
    dog.position.set(chaser.x + 0.8, 0, -(gd + 0.7));
    const ud = dog.userData; ud.legs.forEach((l, i) => l.rotation.x = Math.sin(a * 1.2 + (i % 2 ? Math.PI : 0) + (i > 1 ? 1.5 : 0)) * 0.8);
    ud.tail.rotation.y = Math.sin(animT * 20) * 0.6; dog.position.y = Math.abs(Math.sin(a * 1.2)) * 0.08;
  }
}

function positionWorld(d) {
  const c = d + 110;
  track.position.z = -c; trackTex.offset.y = (c / TILE) % 1;
  pave.position.z = -c; rails.position.z = -c; wire.position.z = -c; wallCap.position.z = -c;
  wallL.position.z = -c; wallR.position.z = -c; wallTex.offset.x = (c / WALL_TILE) % 1;
  let moved = false;
  for (let i = 0; i < blds.length; i++) if (blds[i].d + blds[i].dz / 2 < d - 15) { placeBld(i); moved = true; }
  if (moved) { bMesh.instanceMatrix.needsUpdate = roofMesh.instanceMatrix.needsUpdate = true; if (bMesh.instanceColor) bMesh.instanceColor.needsUpdate = true; }
  let am = false;
  for (let i = 0; i < AN; i++) if (arches[i] < d - 15) { placeArch(i, arches[i] + AN * ASP); am = true; }
  if (am) postMesh.instanceMatrix.needsUpdate = beamMesh.instanceMatrix.needsUpdate = true;
}
wallR.material = wallMat;

let spin = 0;
function drawCoins(dt) {
  spin += dt * 4;
  _q.setFromEuler(_e.set(0, spin, 0));
  let n = 0;
  for (const c of coins) {
    if (c.d > p.d + 200) continue;
    _m.compose(_p.set(c.x, c.y, -c.d), _q, _s.set(1, 1, 1)); coinMesh.setMatrixAt(n++, _m);
  }
  coinMesh.count = n; coinMesh.instanceMatrix.needsUpdate = true;
  for (const u of powerups) { u.mesh.position.y = u.y + Math.sin(animT * 3 + u.d) * 0.15; u.mesh.rotation.y += dt; }
}

const camPos = new THREE.Vector3(0, 4, 7), camLook = new THREE.Vector3();
let camY = 3.6;
function updateCamera(dt) {
  if (state === 'menu' || state === 'shop') {
    const tx = state === 'shop' ? -1.25 : -1.7;
    camPos.set(p.x + tx, 1.75, -p.d + 4.3);
    camera.position.lerp(camPos, Math.min(1, dt * 4));
    camera.lookAt(p.x + (state === 'shop' ? -0.95 : -1.15), 1.15, -p.d);
    return;
  }
  const ty = 3.4 + (pw.jet > 0 ? p.y * 0.7 : Math.max(0, p.y - (p.air ? 0.8 : 0)) * 0.8);
  camY += (ty - camY) * Math.min(1, dt * 5);
  camPos.set(p.x * 0.75, camY, -p.d + 6.4);
  camera.position.x += (camPos.x - camera.position.x) * Math.min(1, dt * 9);
  camera.position.y = camY; camera.position.z = camPos.z;
  if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake * 0.5; camera.position.y += (Math.random() - 0.5) * shake * 0.5; shake = Math.max(0, shake - dt * 1.5); }
  camLook.set(p.x * 0.55, camY - 1.6, -p.d - 9);
  camera.lookAt(camLook);
}

let lastScore = -1, lastCoins = -1;
function renderPups(force) {
  const el = $('#pups');
  const act = Object.keys(pw).filter(k => pw[k] > 0);
  if (boardT > 0) act.push('board');
  if (force || el.childElementCount !== act.length) {
    el.innerHTML = act.map(k => `<div class="pup"><span>${k === 'board' ? 'Planche' : PW[k].name}</span><div class="bar"><i id="pb_${k}" style="background:${k === 'board' ? '#ffd166' : PW[k].col}"></i></div></div>`).join('');
  }
  for (const k of act) { const b = document.getElementById('pb_' + k); if (b) b.style.width = (100 * (k === 'board' ? boardT / 15 : pw[k] / PW[k].dur)) + '%'; }
}
function updateHud(dt) {
  const s = Math.floor(run.score);
  if (s !== lastScore) { $('#score').textContent = s; lastScore = s; }
  if (run.coins !== lastCoins) { $('#coinN').textContent = run.coins; lastCoins = run.coins; }
  const m = $('#mult'); const txt = 'x' + run.mult; if (m.textContent !== txt) { m.textContent = txt; m.classList.toggle('x2', run.mult > 1); }
  renderPups(false);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('#toast').classList.remove('on'); }
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('#hint').classList.remove('on'); }
}

let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dt <= 0) return;
  if (state === 'play') { update(dt); updateHud(dt); }
  else if (state === 'dead') { deadUpdate(dt); updateHud(dt); }
  else animT += 0;
  animateRunner(dt); animateChaser(dt);
  positionWorld(p.d);
  drawCoins(state === 'pause' ? 0 : dt);
  blob.position.set(p.x, (state === 'menu' || state === 'shop') ? 0.02 : surfaceAt(p.x, p.d, p.y + 0.01) + 0.03, -p.d);
  const hgt = Math.max(0, p.y - blob.position.y); blob.scale.setScalar(Math.max(0.4, 1 - hgt * 0.12));
  updateCamera(dt);
  renderer.render(scene, camera);
  fpsAcc += dt; fpsN++; if (fpsAcc > 1) { window.__fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
}
function onResize() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight;
  camera.fov = camera.aspect < 1 ? 78 : 60; camera.updateProjectionMatrix();
}
addEventListener('resize', onResize); onResize();
refreshMenu(); resetPose();
camera.position.set(-1.7, 1.75, 4.3);
requestAnimationFrame(frame);

window.__mr = { get state() { return state; }, addBarrier, addTrain, p, run, pw, obstacles, coins, startRun, act, save, give(k) { if (k === 'jet') startJet(); else pw[k] = PW[k].dur; renderPups(true); } };
</script>
</body>
</html>
